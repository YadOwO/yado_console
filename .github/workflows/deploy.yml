name: 部署管理端到生产环境

# 只有合并到 main 才部署。dev 上的日常提交不触发，
# 这样 main 代表「已确认要上线的状态」。
on:
  push:
    branches: [main]
  # 允许在 Actions 页面手动触发：用于重试失败的部署，或不改代码重新部署当前 main
  workflow_dispatch:

# 同一时刻只允许一个部署运行；不取消进行中的部署，避免留下半完成状态
concurrency:
  group: deploy-yado-console
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      # 版本取 package.json 的 packageManager 字段
      - name: 准备 pnpm
        uses: pnpm/action-setup@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm run check

      # 构建后会检查产物体积，超出预算即失败
      - name: 构建
        run: pnpm run build

      # nginx 开了 gzip_static，直接发送这里生成的 .gz；-n 去掉时间戳，同样内容压缩结果一致
      - name: 预压缩
        run: find dist -type f \( -name '*.js' -o -name '*.css' -o -name '*.html' -o -name '*.svg' \) -exec gzip -k -9 -n {} +

      # 服务器上那把公钥在 authorized_keys 里被 forced command 限制为
      # 只能执行 /opt/yado/scripts/deploy-yado-console.sh，这里传什么命令都会被忽略，写 deploy 仅作占位。
      # 产物经标准输入传给部署脚本；脚本的输出与退出码会原样返回，失败时本步骤即失败。
      - name: 发布到服务器
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          # 地址与主机公钥都不是秘密（IP 可从 DNS 查到），写在此处便于换机器时一处修改。
          DEPLOY_HOST: 8.163.21.152
          DEPLOY_HOST_KEY: 8.163.21.152 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDKbBzF0ynrtwRHKNsekYVMLHNnT7yTiNZpyaig0WzP6
        run: |
          install -m 700 -d ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # 固定主机公钥而非用 StrictHostKeyChecking=no，避免中间人攻击
          echo "$DEPLOY_HOST_KEY" > ~/.ssh/known_hosts
          tar -czf - -C dist . | ssh -i ~/.ssh/deploy_key "yado@$DEPLOY_HOST" deploy

      # 确认线上首页指向的就是这次构建的脚本，且脚本能正常下载
      - name: 线上验证
        run: |
          html="$(curl -fsS https://console.yado1225.top/)"
          script="$(printf '%s' "$html" | grep -oE '/assets/[^"]+\.js' | head -n 1)"
          if [ -z "$script" ] || [ ! -f "dist$script" ]; then
            echo "::error::线上首页引用的脚本（${script:-无}）不是本次构建的产物"
            exit 1
          fi
          curl -fsS -o /dev/null "https://console.yado1225.top$script"
          echo "线上已是本次构建：$script"

      # 取消运行不发送通知。通知渠道故障不得改变部署本身的结果。
      - name: Bark 通知部署结果
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 1
        env:
          BARK_DEVICE_KEY: ${{ secrets.BARK_DEVICE_KEY }}
          DEPLOY_STATUS: ${{ job.status }}
        run: |
          if [ -z "$BARK_DEVICE_KEY" ]; then
            echo "::warning::未配置 BARK_DEVICE_KEY，跳过 Bark 部署通知。"
            exit 0
          fi

          if [ "$DEPLOY_STATUS" = "success" ]; then
            TITLE="✅ yado_console 生产部署成功"
            DETAIL="管理端已发布，线上验证通过。"
          else
            TITLE="❌ yado_console 生产部署失败"
            DETAIL="检查、构建或发布失败，请查看部署日志。"
          fi

          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}"
          BODY="$(printf '%s\n分支：%s\n提交：%s\n执行者：%s' "$DETAIL" "$GITHUB_REF_NAME" "${GITHUB_SHA:0:7}" "$GITHUB_ACTOR")"
          # jq 负责 JSON 转义；Key 只经请求正文发送，不输出到日志。
          PAYLOAD="$(jq -n \
            --arg device_key "$BARK_DEVICE_KEY" \
            --arg title "$TITLE" \
            --arg body "$BODY" \
            --arg url "$RUN_URL" \
            '{device_key: $device_key, title: $title, body: $body, group: "yado_console 部署", url: $url}')"

          RESPONSE="$(curl --fail --silent --show-error \
            --connect-timeout 5 --max-time 15 \
            --header 'Content-Type: application/json' \
            --data-binary "$PAYLOAD" \
            https://api.day.app/push)"
          if ! printf '%s' "$RESPONSE" | jq -e '.code == 200' > /dev/null; then
            echo "::warning::Bark 未确认通知发送成功，请检查设备 Key 与通知服务。"
            exit 1
          fi
          echo "已将部署结果发送到 Bark。"
