# 芽豆统一管理端（纯静态单页应用）
# 放到服务器 /opt/yado/nginx/conf.d/ 下。
# 文件由部署脚本发布到 /opt/yado/nginx/html/yado-console/releases/<版本>，current 软链指向当前版本；
# 容器内对应 /var/www/html/yado-console/current。

server {
    listen 80;
    server_name console.yado1225.top;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name console.yado1225.top;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/html/yado-console/current;

    # 构建时已生成 .gz，直接发送预压缩文件；没有 .gz 的文本按需压缩
    gzip_static on;
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;

    # 脚本只允许同源；接口只连 yado_hub 与统一登录。以后接入其他后端时把地址加进 connect-src
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://hub-api.yado1225.top https://accounts.yado1225.top; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # 文件名带内容哈希，内容变了文件名就变，可以长期缓存。
    # 用 expires 而不是 add_header 设缓存：location 里一旦有 add_header，上面 server 级的安全头就不再继承
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # 其余路径都返回 index.html，由前端路由处理；index.html 每次都向服务器确认，发布后立即生效
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
